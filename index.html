<title>Para papita</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,300;1,400&family=Great+Vibes&family=Press+Start+2P&family=Pixelify+Sans:wght@400;600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Layout: escenario vertical tipo celular centrado; una sola capa WebGL con tres escenas
     que se "scrollean" solas, y los textos encima. Look nocturno/lila fijo, sin tema claro. */
  :root {
    --void: #000000;
    --ink: #f7efe4;
    --rose: #ffb3d1;
    --moon: #eef0e4;
    --xp: #8cff2e;
    --serif: "Cormorant Garamond", "Cormorant", Georgia, "Times New Roman", serif;
    --script: "Great Vibes", "Brush Script MT", cursive;
    --sans: "DM Sans", "Helvetica Neue", Arial, sans-serif;
    --font-pixel: "Press Start 2P", "Courier New", monospace;
    --font-body: "Pixelify Sans", "Courier New", monospace;
    color-scheme: dark;
  }

  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    background: #07040c radial-gradient(ellipse 60% 70% at 50% 50%, #1b0f2a, #07040c 70%);
    color: var(--ink);
    font-family: var(--serif);
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  #stage {
    position: fixed; top: 0; bottom: 0; left: 50%;
    width: 100%; transform: translateX(-50%);
    overflow: hidden; background: var(--void);
  }
  #scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .vignette {
    position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background: radial-gradient(ellipse 95% 80% at 50% 42%, transparent 55%, rgba(2, 0, 10, 0.55) 100%);
  }

  /* ---------- intro en negro ---------- */
  #intro {
    position: absolute; inset: 0; z-index: 6; box-sizing: border-box;
    display: grid; place-items: center; text-align: center; pointer-events: none;
    background: var(--void);
    padding-left: max(24px, env(safe-area-inset-left, 0px));
    padding-right: max(24px, env(safe-area-inset-right, 0px));
  }
  .beat {
    grid-area: 1 / 1; max-width: 22ch; margin: 0; opacity: 0;
    font: italic 400 clamp(30px, 6.4vw, 66px) / 1.2 var(--serif);
    letter-spacing: 0.01em; color: var(--ink);
    text-shadow: 0 0 34px rgba(255, 226, 196, 0.28); text-wrap: balance;
  }
  .beat.wide { max-width: 30ch; }
  .pair { grid-area: 1 / 1; display: grid; gap: 0.75em; justify-items: center; width: 100%; }
  .pair .beat { grid-area: auto; }
  .pair .beat:first-child { font-weight: 300; font-size: clamp(26px, 5vw, 54px); }

  /* ---------- texto que sale de la luna ---------- */
  .moon-wrap {
    position: absolute; left: 0; top: 0; z-index: 2;
    white-space: nowrap; transform-origin: 0 0; pointer-events: none;
    visibility: hidden;
  }
  .moon-text {
    display: inline-block; opacity: 0;
    font-family: var(--script); font-size: 34px; line-height: 1.25;
    padding: 0 0.15em; color: var(--moon);
    text-shadow: 0 0 6px rgba(255, 255, 255, 0.55), 0 0 18px rgba(170, 190, 255, 0.9), 0 0 38px rgba(130, 150, 255, 0.55);
  }

  /* ---------- letras de la seccion de las fotos ---------- */
  .lyrics {
    position: absolute; left: 0; right: 0; top: 0; height: 32%; z-index: 3; box-sizing: border-box;
    display: grid; place-items: center; pointer-events: none;
    padding-left: max(24px, env(safe-area-inset-left, 0px));
    padding-right: max(24px, env(safe-area-inset-right, 0px));
    padding-top: calc(env(safe-area-inset-top, 0px) + 18px);
    transform: translate3d(0, 200%, 0);
  }
  .lyric {
    grid-area: 1 / 1; margin: 0; max-width: 17em; text-align: center; text-wrap: balance;
    font: 400 clamp(21px, 5.8vw, 32px) / 1.35 var(--sans); color: #3b2142;
  }
  .lyric .lw { display: inline-block; opacity: 0; }

  .lyric .hi { color: #d0528c; font-weight: 500; }

  /* ---------- seccion final ---------- */
  .final {
    position: absolute; inset: 0; z-index: 3; box-sizing: border-box;
    display: grid; place-items: center;
    padding-left: max(26px, env(safe-area-inset-left, 0px));
    padding-right: max(26px, env(safe-area-inset-right, 0px));
    padding-block: calc(24px + env(safe-area-inset-top, 0px)) calc(24px + env(safe-area-inset-bottom, 0px));
    background: radial-gradient(ellipse 85% 42% at 50% 50%, rgba(26, 8, 38, 0.5), transparent 72%);
    transform: translate3d(0, 200%, 0);
    pointer-events: none;
  }
  .final-text {
    margin: 0; max-width: 20ch; text-align: center; text-wrap: balance; opacity: 0;
    font: italic 400 clamp(27px, 6.4vw, 54px) / 1.28 var(--serif);
    letter-spacing: 0.01em; color: #fff6fa;
    text-shadow: 0 0 34px rgba(255, 200, 230, 0.35), 0 2px 18px rgba(40, 0, 40, 0.6);
  }
  .final-text .heart { display: inline-block; color: var(--rose); font-style: normal; font-weight: 500; }
  .replay {
    position: absolute; left: 50%; transform: translateX(-50%);
    bottom: calc(28px + env(safe-area-inset-bottom, 0px));
    pointer-events: auto; cursor: pointer;
    font: 500 14px/1 var(--serif); letter-spacing: 0.24em; text-transform: uppercase;
    color: #fff6fa; background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 230, 240, 0.55); border-radius: 999px;
    padding: 12px 22px;
  }
  .replay:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

</style>

<div id="stage">
  <canvas id="scene" role="img" aria-label="Campo de bloques de noche con estrellas, una luna cuadrada, cuatro gatitos con gorrito y un tornado de cartas."></canvas>
  <div class="vignette" id="vignette"></div>

  <div class="moon-wrap" id="moonWrap"><span class="moon-text" id="moonText">Feliz cumple papita</span></div>

  <div id="intro">
    <p class="beat wide" id="b1">Jamás pensamos que nuestros caminos se unirían</p>
    <div class="pair">
      <p class="beat" id="b2a">Pero sin duda</p>
      <p class="beat wide" id="b2b">repetiría esta historia una y mil veces :)</p>
    </div>
  </div>

  <div class="lyrics" id="lyrics"></div>

  <section class="final" id="final">
    <p class="final-text" id="finalText">El amor que te tengo no se puede describir con palabras, pero sin duda quiero que seas tú con quien comparta mi presente y mi futuro <span class="heart" id="heart">&lt;3</span></p>
    <button class="replay" id="replay" type="button" hidden>Ver de nuevo</button>
  </section>
</div>

  /* ---------- helpers ---------- */
  const D = Math.PI / 180;
  const $ = (id) => document.getElementById(id);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, f) => a + (b - a) * f;
  const span = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
  const smooth = (a, b, x) => { const k = span(x, a, b); return k * k * (3 - 2 * k); };
  const ease = (x) => { x = clamp(x, 0, 1); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
  const easeOut = (x) => { x = clamp(x, 0, 1); return 1 - Math.pow(1 - x, 3); };
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  // random con semilla para que todo salga igual cada vez
  function rng(seed) {
    return function () {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function hash2(i, j) {
    let h = (Math.imul(i, 374761393) + Math.imul(j, 668265263)) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    h = h ^ (h >>> 16);
    return (h >>> 0) / 4294967296;
  }
  function noise2(x, z) {
    const xi = Math.floor(x), zi = Math.floor(z);
    const xf = x - xi, zf = z - zi;
    const u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);
    return lerp(lerp(hash2(xi, zi), hash2(xi + 1, zi), u), lerp(hash2(xi, zi + 1), hash2(xi + 1, zi + 1), u), v);
  }
  function fbm(x, z) {
    let s = 0, amp = 0.5, f = 1;
    for (let o = 0; o < 4; o++) { s += amp * noise2(x * f, z * f); f *= 2; amp *= 0.5; }
    return s / 0.9375;
  }
  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- la animacion de texto (blur + sube + letras se juntan) ---------- */
  function showText(el, e, rise) {
    if (rise === undefined) rise = 10;
    e = Math.round(clamp(e, 0, 1) * 500) / 500;
    if (el._e === e) return;
    el._e = e;
    el.style.opacity = String(e);
    el.style.filter = e >= 1 ? 'none' : 'blur(' + ((1 - e) * 8).toFixed(1) + 'px)';
    el.style.transform = e >= 1 ? 'none' : 'translateY(' + ((1 - e) * rise).toFixed(1) + 'px)';
    el.style.letterSpacing = (0.01 + (1 - e) * 0.05).toFixed(3) + 'em';
  }
  const window4 = (T, w) => smooth(w[0], w[1], T) * (1 - smooth(w[2], w[3], T));

  const TL = {
    // [empieza a aparecer, ya visible, empieza a irse, ya no esta]
    b1: [1.0, 3.2, 7.4, 9.6],
    b2a: [10.8, 12.8, 22.4, 24.4],
    b2b: [14.6, 17.0, 22.4, 24.4],
    reveal: 24.8, revealEnd: 27.6,
    moon1: 28.2, moon1End: 33.4,      // el texto sale de la luna hacia la izquierda
    moon2: 33.9, moon2End: 36.9,      // y luego se va al centro

  };

    moonWrap: $('moonWrap'), moonText: $('moonText'),

  // ya no hay pantalla de carga; esto se queda vacio para no tocar el resto
  function progress() {}

  /* ---------- tamano del escenario (vertical tipo celular) ---------- */
  const stage = $('stage');
  let W = 0, H = 0;
  function measure() {
    const vw = window.innerWidth, vh = window.innerHeight;
    W = vw <= 700 ? vw : Math.round(Math.min(vw, vh * 0.62));

  let t = 0, clock = 0, running = false;

  async function init() {
    if (!window.THREE) throw new Error('three.js no cargo');

    if (document.fonts && document.fonts.load) {

    }

    const canvas = $('scene');
    const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
    const pr = Math.min(window.devicePixelRatio || 1, 1.75);
    renderer.setPixelRatio(pr);
    renderer.setClearColor(0x000000, 1);
    renderer.setScissorTest(true);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    const aniso = Math.min(8, renderer.capabilities.getMaxAnisotropy());

    const camA = new THREE.PerspectiveCamera(75, 0.5, 0.1, 1200);
    camA.position.set(0, 2.2, 8);
    camA.rotation.order = 'YXZ';
    const camB = new THREE.PerspectiveCamera(50, 0.5, 0.1, 200);
    camB.position.set(0, 0, 10);
    const camC = new THREE.PerspectiveCamera(50, 0.5, 0.1, 200);
    camC.position.set(0, 0, 10);

    /* ----- medidas que dependen de la pantalla ----- */
    const L = {};
    const WALK_GAP = 2.2;   // separacion entre gatos mientras caminan
    function measureCams() {
      measure();
      renderer.setSize(W, H, false);
      const asp = W / H;
      camA.aspect = asp; camA.fov = asp < 1 ? 75 : 64; camA.updateProjectionMatrix();
      L.tanHA = Math.tan(camA.fov * D / 2) * asp;
      L.catDist = clamp(3.5 / (2 * L.tanHA), 4.0, 8);
      L.catZ = camA.position.z - L.catDist;
      L.visWcat = 2 * L.catDist * L.tanHA;
      L.spacing = clamp(L.visWcat * 0.25, 0.82, 1.25);
      L.travel = L.visWcat / 2 + L.spacing * 2 + 1.5;
      L.speed = L.travel / 6.2;
      L.pitchCats = -Math.atan((camA.position.y - 1.0) / L.catDist);
      L.azM = clamp(Math.atan(L.tanHA) * 0.52, 6 * D, 14 * D);

      camC.aspect = asp; camC.updateProjectionMatrix();

    // tiempos de cada gato y del resto de la historia
    function timeline() {
      L.cat = [];
      const lead = 1.5 * L.spacing;
      const lastStart = lead - L.travel;
      let lastArrive = 0;
      for (let i = 0; i < 4; i++) {
        const tx = (i - 1.5) * L.spacing;
        const start = lastStart - (3 - i) * WALK_GAP;
        const dist = tx - start;
        const dur = dist / L.speed;
        const arrive = TL.walkIn + dur;
        L.cat.push({ tx: tx, start: start, dist: dist, dur: dur, arrive: arrive });
        lastArrive = Math.max(lastArrive, arrive);
      }
      TL.lastSit = lastArrive + 1.5;
      TL.hop = TL.lastSit + 0.9;
      TL.scroll1 = TL.hop + 6.6; TL.scroll1End = TL.scroll1 + 2.8;
      TL.lyric0 = TL.scroll1End + 0.3;
      TL.cards = CARD_AT.map((a) => TL.lyric0 + a);
      TL.dissolve = TL.lyric0 + DISSOLVE_AT; TL.dissolveEnd = TL.dissolve + 3.0;
      TL.scroll2 = TL.lyric0 + SECTION_LEN; TL.scroll2End = TL.scroll2 + 2.8;
      TL.final = [TL.scroll2End + 0.2, TL.scroll2End + 2.8, 1e9, 1e9];
      TL.replay = TL.scroll2End + 7;
    }
    measureCams();

    /* ----- utilidades de texturas ----- */
    function pixTex(size, draw, o) {
      o = o || {};
      const c = document.createElement('canvas');
      c.width = c.height = size;
      draw(c.getContext('2d'), size);
      const tx = new THREE.CanvasTexture(c);
      tx.magFilter = THREE.NearestFilter;
      if (o.mip === false) { tx.generateMipmaps = false; tx.minFilter = THREE.NearestFilter; }
      else { tx.minFilter = THREE.NearestMipmapLinearFilter; }

      tx.anisotropy = aniso;

    function canvasTex(w, h, draw) {

      draw(c.getContext('2d'), w, h);
      const tx = new THREE.CanvasTexture(c);
      tx.anisotropy = aniso;
      return tx;

    // pinta pixeles con manchas suaves para que no se vea ruido plano
    function blotch(g, s, pal, seed, scale) {
      const r = rng(seed);
      for (let x = 0; x < s; x++) for (let y = 0; y < s; y++) {
        const n = noise2(x * (scale || 0.45) + seed, y * (scale || 0.45) - seed) * 0.65 + r() * 0.35;

      }
    }

    const DIRT = ['#5a3e29', '#6a4a31', '#79553a', '#866043', '#93694a'];
    const T = {
      grassTop: pixTex(16, (g, s) => blotch(g, s, GRASS, 3)),
      grassSide: pixTex(16, (g, s) => {
        blotch(g, s, DIRT, 5);
        const r = rng(6);
        for (let x = 0; x < s; x++) {

    /* ----- terreno de bloques ----- */
    const B = 1.6, GR = 80;                  // tamano de bloque y radio del mapa en bloques

    const pondD = (x, z) => { const a = (x - POND.x) / POND.rx, b = (z - POND.z) / POND.rz; return a * a + b * b; };
    function heightAt(i, j) {

    for (let i = -GR; i <= GR; i++) for (let j = -GR; j <= GR; j++) {
      const h = heightAt(i, j);

    // caminito de tierra hacia el estanque y rocas de piedra con musgo

        const sz = 1 + ((r() * 2) | 0);

    progress(0.16, 'Colocando bloques...');
    await wait(40);
    // materiales: 0 pasto arriba, 1 pasto lado, 2 tierra, 3 arena, 4 piedra, 5 caminito, 6 piedra con musgo
    const terrainMats = [T.grassTop, T.grassSide, T.dirt, T.sand, T.stone, T.path, T.cobble].map((tx) => new THREE.MeshLambertMaterial({ map: tx, vertexColors: true }));
    const AO = [0.5, 0.66, 0.83, 1.0];
    function newBufs() { return [0, 1, 2, 3, 4, 5, 6].map(() => ({ p: [], n: [], u: [], c: [], ix: [], v: 0 })); }
    function pushQuad(b, vs, nx, ny, nz, cols, flip) {
      const base = b.v;

        b.p.push(vs[k][0], vs[k][1], vs[k][2]);

    function aoLevel(s1, s2, c) { return (s1 && s2) ? 0 : 3 - ((s1 ? 1 : 0) + (s2 ? 1 : 0) + (c ? 1 : 0)); }
    const CH = 23;
    for (let ci = -GR; ci <= GR; ci += CH) {
      for (let cj = -GR; cj <= GR; cj += CH) {

        for (let i = ci; i < Math.min(ci + CH, GR + 1); i++) {
          for (let j = cj; j < Math.min(cj + CH, GR + 1); j++) {
            const h = HM[hid(i, j)], sand = SAND[hid(i, j)], kind = KIND[hid(i, j)];
            const x0 = (i - 0.5) * B, x1 = (i + 0.5) * B, z0 = (j - 0.5) * B, z1 = (j + 0.5) * B, y = h * B;
            const hi = (di, dj) => { const v = hAt(i + di, j + dj); return v !== null && v > h; };
            // tapa de arriba con oclusion en las esquinas
            const a0 = aoLevel(hi(-1, 0), hi(0, 1), hi(-1, 1));
            const a1 = aoLevel(hi(1, 0), hi(0, 1), hi(1, 1));
            const a2 = aoLevel(hi(1, 0), hi(0, -1), hi(1, -1));
            const a3 = aoLevel(hi(-1, 0), hi(0, -1), hi(-1, -1));
            const tint = (sand ? 1 : 0.86 + 0.18 * noise2(i * 0.21, j * 0.21)) * (0.93 + 0.1 * hash2(i * 13 + 7, j * 29 - 3));
            const topMat = sand ? 3 : (kind === 1 ? 5 : (kind === 2 ? 6 : 0));
            pushQuad(bufs[topMat], [[x0, y, z1], [x1, y, z1], [x1, y, z0], [x0, y, z0]], 0, 1, 0,
              [AO[a0] * tint, AO[a1] * tint, AO[a2] * tint, AO[a3] * tint], a0 + a2 < a1 + a3);
            // lados que quedan expuestos
            const sides = [
              [1, 0, 0.86, (y0, y1) => [[x1, y0, z1], [x1, y0, z0], [x1, y1, z0], [x1, y1, z1]], 1, 0, 0],
              [-1, 0, 0.86, (y0, y1) => [[x0, y0, z0], [x0, y0, z1], [x0, y1, z1], [x0, y1, z0]], -1, 0, 0],
              [0, 1, 0.95, (y0, y1) => [[x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1]], 0, 0, 1],
              [0, -1, 0.95, (y0, y1) => [[x1, y0, z0], [x0, y0, z0], [x0, y1, z0], [x1, y1, z0]], 0, 0, -1]

    }
    const tallGrassTex = pixTex(16, (g) => {

    }, { mip: false });
    function flowerTex(kind) {

    const pbMat = new THREE.PointsMaterial({ size: 0.07, vertexColors: true, transparent: true, opacity: 0.85, depthWrite: false });
    const pbPoints = new THREE.Points(pbGeo, pbMat);
    pbPoints.frustumCulled = false;
    sceneB.add(pbPoints);
    const NPP = 70;
    const paperGeo = new THREE.PlaneGeometry(0.14, 0.14);
    const papers = new THREE.InstancedMesh(paperGeo, new THREE.MeshLambertMaterial({ color: 0xffffff, side: THREE.DoubleSide, emissive: 0x401028, depthWrite: false }), NPP);
    papers.frustumCulled = false;
    const ppData = [], rpp = rng(94);
    for (let i = 0; i < NPP; i++) {
      ppData.push({ a0: rpp() * Math.PI * 2, u0: rpp(), sp: 0.7 + rpp() * 0.6, rx: rpp() * 6, ry: rpp() * 6 });
      papers.setColorAt(i, C.set(['#ff8fbb', '#ffc2da', '#ffffff', '#d7b8ff'][i % 4]));
    }
    papers.instanceColor.needsUpdate = true;
    sceneB.add(papers);

    const hGeo = (function () {
      const rows = ['.XX.XX.', 'XXXXXXX', 'XXXXXXX', '.XXXXX.', '..XXX..', '...X...'];
      const box = new THREE.BoxGeometry(1, 1, 1).toNonIndexed();
      const bp = box.attributes.position.array, bn = box.attributes.normal.array;
      const pos = [], nor = [];
      rows.forEach((row, y) => {
        for (let x = 0; x < row.length; x++) {
          if (row[x] !== 'X') continue;
          for (let j = 0; j < bp.length; j += 3) {
            pos.push(bp[j] + x - 3, bp[j + 1] + (2.5 - y), bp[j + 2]);
            nor.push(bn[j], bn[j + 1], bn[j + 2]);
          }
        }
      });
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
      g.scale(0.1, 0.1, 0.1);
      return g;
    })();
    const heartPal = ['#ff6f9f', '#ff9ec4', '#ffd1e3', '#e84a7f', '#c9a4ff', '#ffffff'];
    const NHB = 9;
    const heartsB = new THREE.InstancedMesh(hGeo, new THREE.MeshLambertMaterial({ color: 0xffffff, emissive: 0x3a1030 }), NHB);
    heartsB.frustumCulled = false;
    const hbData = [], rhb = rng(95);
    for (let i = 0; i < NHB; i++) {
      hbData.push({ x: (rhb() - 0.5), y: -0.15 + (rhb() - 0.5) * 0.7, z: -3 - rhb() * 4, s: 0.6 + rhb() * 0.7, ph: rhb() * 6 });
      heartsB.setColorAt(i, C.set(heartPal[i % heartPal.length]));
    }
    heartsB.instanceColor.needsUpdate = true;
    sceneB.add(heartsB);

    const tP = new THREE.Vector3(), gP = new THREE.Vector3(), tQ = new THREE.Quaternion(), gQ = new THREE.Quaternion(), tE = new THREE.Euler(), gE = new THREE.Euler();
    // lugar final de cada carta: cuadricula de 2x2 debajo de las letras
    function slot(k, out) {
      const gw = L.gw, gap = gw * 0.1;
      const col = k % 2, row = (k / 2) | 0;
      return out.set((col - 0.5) * (gw + gap), L.cyB + (0.5 - row) * (gw * 1.25 + gap), 0.3);
    }
    function updateB(t) {
      const tau = Math.max(0, t - TL.scroll1);
      const grow = ease(span(t, TL.scroll1, TL.scroll1 + 2.6));
      const dis = ease(span(t, TL.dissolve, TL.dissolveEnd));   // el remolino se deshace
      const hS = L.visHB * 0.56;                                // alto del remolino
      const Rf = (u) => (0.14 + 0.86 * Math.pow(u, 1.3)) * L.visWB * 0.4;
      cards.forEach((c, k) => {
        const q = span(t, TL.cards[k], TL.cards[k] + 2.4);
        c.mesh.visible = q > 0;
        if (q <= 0) return;
        // sube girando por el remolino y luego se va a su lugar volteandose
        const th = k * 1.9 + q * Math.PI * 2.4 + tau * 0.4;
        const r = Rf(0.25 + q * 0.7);
        tP.set(Math.sin(th) * r, L.cyB + (q - 0.55) * hS, -1.2 + Math.cos(th) * r);
        tQ.setFromEuler(tE.set(0.2 * Math.sin(th * 2), Math.PI + 0.5 * Math.sin(th), 0.3 * Math.sin(th * 1.3)));
        slot(k, gP);
        const land = span(q, 0.85, 1);
        gP.z += Math.sin(Math.PI * land) * 0.35 + Math.sin(clock * 1.2 + k) * 0.04 * q;
        gP.y += Math.sin(clock * 1.3 + k) * 0.04 * q;
        gQ.setFromEuler(gE.set(0, Math.sin(clock * 0.8 + k) * 0.06, c.rest));
        const f = ease(span(q, 0.5, 1));
        c.mesh.position.copy(tP).lerp(gP, f);
        c.mesh.quaternion.copy(tQ).slerp(gQ, ease(span(q, 0.35, 0.95)));
        c.mesh.scale.setScalar(L.gw * lerp(0.25, 1, ease(span(q, 0, 0.7))));
      });
      // particulas del remolino
      for (let i = 0; i < NPB; i++) {
        const d = pbData[i];
        const u = (d.u0 + tau * 0.11 * d.sp) % 1;
        const th = d.a0 + tau * 2.4 * d.sp * (1 - dis * 0.7);
        const r = Rf(u) * 1.1 * grow * d.j * (1 + dis * 2.6);
        pbPos[i * 3] = Math.sin(th) * r;
        pbPos[i * 3 + 1] = L.cyB + (u - 0.5) * hS + dis * (u - 0.3) * 3;
        pbPos[i * 3 + 2] = -1.8 + Math.cos(th) * r;
      }
      pbGeo.attributes.position.needsUpdate = true;
      pbMat.opacity = 0.8 * (1 - dis);
      // papelitos: giran y al final salen volando y caen
      for (let i = 0; i < NPP; i++) {
        const d = ppData[i];
        const u = (d.u0 + tau * 0.09 * d.sp) % 1;
        const th = d.a0 + tau * 2.0 * d.sp * (1 - dis * 0.6);
        const r = Rf(u) * grow * (1 + dis * 3.2);
        M.compose(
          P.set(Math.sin(th) * r, L.cyB + (u - 0.5) * hS * 0.95 - dis * dis * 3, -1.8 + Math.cos(th) * r),
          Q.setFromEuler(E.set(d.rx + tau * 3 * d.sp, d.ry + tau * 2, 0)),
          S.setScalar(Math.max(0.0001, grow * (1 - dis))));
        papers.setMatrixAt(i, M);
      }
      papers.instanceMatrix.needsUpdate = true;
      hbData.forEach((d, i) => {
        M.compose(
          P.set(d.x * L.visWB * 1.2, d.y * L.visHB + Math.sin(clock * 0.7 + d.ph) * 0.3, d.z),
          Q.setFromEuler(E.set(0, clock * 0.6 + d.ph, Math.sin(clock + d.ph) * 0.2)),
          S.setScalar(d.s));
        heartsB.setMatrixAt(i, M);
      });
      heartsB.instanceMatrix.needsUpdate = true;
    }

    /* =====================================================
       ESCENA C: el mensaje final con corazones que suben
       ===================================================== */
    progress(0.86, 'Escribiendo el final...');
    await wait(40);
    const sceneC = new THREE.Scene();
    sceneC.background = canvasTex(4, 256, (g, w, h) => {
      const gr = g.createLinearGradient(0, 0, 0, h);
      gr.addColorStop(0, '#2a1340'); gr.addColorStop(0.55, '#6b2f6e'); gr.addColorStop(1, '#c45e8e');
      g.fillStyle = gr; g.fillRect(0, 0, w, h);
    });
    sceneC.add(new THREE.HemisphereLight(0xffe6f2, 0x5a2a6a, 0.85));
    const dirC = new THREE.DirectionalLight(0xffffff, 0.55);
    dirC.position.set(3, 5, 8);
    sceneC.add(dirC);
    const NHC = 44;
    const heartsC = new THREE.InstancedMesh(hGeo, new THREE.MeshLambertMaterial({ color: 0xffffff, emissive: 0x2a0820 }), NHC);
    heartsC.frustumCulled = false;
    const hcData = [], rhc = rng(97);
    for (let i = 0; i < NHC; i++) {
      hcData.push({ x: rhc() - 0.5, z: -7 + rhc() * 8, s: 0.45 + rhc() * 0.85, ph: rhc(), sp: 0.035 + rhc() * 0.04, rot: (rhc() - 0.5) * 2.2, w: rhc() * 6 });
      heartsC.setColorAt(i, C.set(heartPal[(rhc() * heartPal.length) | 0]));
    }
    heartsC.instanceColor.needsUpdate = true;
    sceneC.add(heartsC);
    const NPC = 140, pcPos = new Float32Array(NPC * 3), pcData = [], rpc = rng(99);
    for (let i = 0; i < NPC; i++) pcData.push({ x: rpc() - 0.5, z: -8 + rpc() * 9, ph: rpc(), sp: 0.02 + rpc() * 0.03 });
    const pcGeo = new THREE.BufferGeometry();
    pcGeo.setAttribute('position', new THREE.BufferAttribute(pcPos, 3));
    const pcPoints = new THREE.Points(pcGeo, new THREE.PointsMaterial({ size: 0.06, color: 0xfff0f6, transparent: true, opacity: 0.8, depthWrite: false }));
    pcPoints.frustumCulled = false;
    sceneC.add(pcPoints);

    function updateC(t) {
      const tau = t - TL.scroll2 + 8;
      hcData.forEach((d, i) => {
        const u = (d.ph + tau * d.sp) % 1;
        const span2 = L.visHC + 3;
        M.compose(
          P.set(d.x * L.visWC * 1.3 + Math.sin(tau * 0.6 + d.w) * 0.25, -span2 / 2 + u * span2, d.z),
          Q.setFromEuler(E.set(0, tau * d.rot + d.w, Math.sin(tau * 0.8 + d.w) * 0.25)),
          S.setScalar(d.s));
        heartsC.setMatrixAt(i, M);
      });
      heartsC.instanceMatrix.needsUpdate = true;
      for (let i = 0; i < NPC; i++) {
        const d = pcData[i];
        const u = (d.ph + tau * d.sp) % 1;
        pcPos[i * 3] = d.x * L.visWC * 1.4;
        pcPos[i * 3 + 1] = -L.visHC / 2 - 1 + u * (L.visHC + 2);
        pcPos[i * 3 + 2] = d.z;
      }
      pcGeo.attributes.position.needsUpdate = true;
    }

    /* ----- texto de la luna: tamano y punto final (depende de la pantalla) ----- */
    const _v = new THREE.Vector3();
    function toScreen(p, out) {
      _v.copy(p).project(camA);
      out.x = (_v.x + 1) / 2 * W; out.y = (1 - _v.y) / 2 * H; out.z = _v.z;
      return out;
    }
    const PITCH_MOON = 0.27;
    const anchorW = new THREE.Vector3();
    function layoutMoonText() {
      placeMoon();
      camA.rotation.set(PITCH_MOON, 0, 0);
      camA.updateMatrixWorld();
      const pl = toScreen(moonLeftW, {}), pt = toScreen(moonTopW, {});
      const mt = els.moonText;
      mt.style.letterSpacing = '0.01em';
      mt.style.fontSize = '100px';
      const w100 = mt.offsetWidth || 1000;
      const fs = clamp(100 * (pl.x - 16) / w100, 16, 46);
      mt.style.fontSize = fs.toFixed(1) + 'px';
      const w = mt.offsetWidth, h = mt.offsetHeight;
      L.mtScale = clamp(W * 0.86 / w, 1, 1.9);
      let cy = pt.y - h * L.mtScale / 2 - 14;
      cy = Math.max(cy, H * 0.07 + h * L.mtScale / 2);
      _v.set(0, 1 - 2 * cy / H, 0.5).unproject(camA);
      anchorW.copy(_v).sub(camA.position).normalize().multiplyScalar(400).add(camA.position);
      mt._e = undefined;
    }
    layoutMoonText();

    const sp1 = {}, sp2 = {}, sp3 = {}, sp4 = {};
    let mtVisible = false;
    function updateMoonText(t, p) {
      const wrap = els.moonWrap, mt = els.moonText;
      const on = t >= TL.moon1 && p < 1 && t < TL.tiltEnd + 1;
      if (on !== mtVisible) { wrap.style.visibility = on ? 'visible' : 'hidden'; mtVisible = on; }
      if (!on) { showText(mt, 0); return; }
      showText(mt, smooth(TL.moon1, TL.moon1 + 2.4, t));
      const pl = toScreen(moonLeftW, sp1), pc = toScreen(moonCenW, sp2), pa = toScreen(anchorW, sp3);
      const w = mt.offsetWidth, h = mt.offsetHeight;
      // fase 1: sale de detras de la luna hacia la izquierda
      const q1 = ease(span(t, TL.moon1, TL.moon1End));
      const x1 = pl.x - q1 * w, y1 = pc.y - h / 2;
      // fase 2: sube y se va al centro
      const q2 = span(t, TL.moon2, TL.moon2End);
      // primero sube por encima de la luna y ya luego crece y se centra, asi nunca la pisa
      const qy = ease(span(q2, 0, 0.5)), qx = ease(span(q2, 0.4, 1)), qs = ease(span(q2, 0.4, 1));
      const s = lerp(1, L.mtScale, qs);
      const x2 = pa.x - w * s / 2, y2 = pa.y - h * s / 2;
      const x = lerp(x1, x2, qx), y = lerp(y1, y2, qy);
      wrap.style.transform = 'translate3d(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px,0) scale(' + s.toFixed(3) + ')';
      // lo que sigue detras de la luna no se ve, pero solo mientras va saliendo
      const behind = t < TL.moon1End && x + w * s > pl.x;
      if (behind) {
        const keep = Math.max(0, (pl.x - x) / s);
        wrap.style.clipPath = 'polygon(-80px -80px, ' + keep.toFixed(1) + 'px -80px, ' + keep.toFixed(1) + 'px calc(100% + 80px), -80px calc(100% + 80px))';
      } else {
        wrap.style.clipPath = 'none';
      }
    }

    /* ----- escena A por cuadro ----- */
    function updateA(t, p) {
      let pitch = lerp(0.2, PITCH_MOON, easeOut(span(t, TL.reveal, TL.moon1)));
      pitch = lerp(pitch, L.pitchCats, ease(span(t, TL.tiltIn, TL.tiltEnd)));
      const sway = reduceMotion ? 0 : Math.sin(clock * 0.1) * 0.015;
      camA.rotation.set(pitch, sway, 0);
      camA.updateMatrixWorld();
      starU.uTime.value = clock;
      flyU.uTime.value = clock;
      mistMats.forEach((m) => { m.uniforms.uTime.value = clock; });
      waterTex.offset.set(clock * 0.03, clock * 0.015);
      if (!reduceMotion) {
        clouds.forEach((c) => { c.position.x += 0.03; if (c.position.x > 330) c.position.x = -330; });
      }
      updateMeteor();
      updateTorches();
      updateCats(t);
      updateMoonText(t, p);
    }

    function relayout() {
      measureCams();
      placeTorches();
      layoutMoonText();
    }
    window.addEventListener('resize', relayout);

    // compilo los shaders mientras sigue la pantalla de carga
    progress(0.93, 'Encendiendo la luna...');
    await wait(40);
    updateA(TL.reveal, 0); updateB(TL.scroll1 + 1); updateC(TL.scroll2);
    renderer.compile(sceneA, camA); renderer.compile(sceneB, camB); renderer.compile(sceneC, camC);
    await wait(80);

    /* ----- dibujar las tres escenas como si fueran secciones de una pagina ----- */
    function draw(scene, cam, off) {
      const y = off * H;
      const y0 = Math.max(0, y), y1 = Math.min(H, y + H);
      if (y1 - y0 < 0.5) return;
      renderer.setViewport(0, y, W, H);
      renderer.setScissor(0, y0, W, y1 - y0);
      renderer.render(scene, cam);
    }

    // cada frase se arma palabra por palabra, como en los videos de letras
    const lyricLines = LINES.map((line) => {
      const p = document.createElement('p');
      p.className = 'lyric';
      let hi = false;
      const words = [];
      line.text.split(/\s+/).forEach((raw, i, arr) => {
        let w = raw;
        const opens = w.startsWith('*'), closes = w.endsWith('*');
        if (opens) { hi = true; w = w.slice(1); }
        if (closes) w = w.slice(0, -1);
        const sp = document.createElement('span');
        sp.className = 'lw' + (hi ? ' hi' : '');
        sp.textContent = w;
        p.appendChild(sp);
        if (i < arr.length - 1) p.appendChild(document.createTextNode(' '));
        words.push(sp);
        if (closes) hi = false;
      });
      els.lyrics.appendChild(p);
      return words;
    });
    function updateLyrics(t) {
      lyricLines.forEach((words, li) => {
        const start = TL.lyric0 + LINES[li].at;
        const next = LINES[li + 1];
        const end = next ? TL.lyric0 + next.at + 0.3 : TL.scroll2End;
        words.forEach((sp, wi) => {
          const a = start + wi * WORD_STEP;
          showText(sp, smooth(a, a + 0.5, t) * (1 - smooth(end - 0.6, end, t)), 8);
        });
      });
    }

    let lastP = -1;
    function updateText(t) {
      updateLyrics(t);
      if (t > TL.revealEnd + 0.2) {
        if (!els.intro.hidden) els.intro.hidden = true;
      } else {
        if (els.intro.hidden) els.intro.hidden = false;
        els.intro.style.background = 'rgba(0,0,0,' + (1 - smooth(TL.reveal, TL.revealEnd, t)).toFixed(3) + ')';
        showText(els.b1, window4(t, TL.b1));
        showText(els.b2a, window4(t, TL.b2a));
        showText(els.b2b, window4(t, TL.b2b));
      }
      showText(els.finalText, window4(t, TL.final));
      if (els.finalText._e >= 1 && !reduceMotion) {
        els.heart.style.transform = 'scale(' + (1 + 0.12 * Math.max(0, Math.sin(clock * 3.2))).toFixed(3) + ')';
      }
      const showReplay = t > TL.replay;
      if (els.replay.hidden === showReplay) els.replay.hidden = !showReplay;
    }

    let last = performance.now(), paused = false;
    function frame(now) {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      clock += dt;
      if (running) t += dt;
      updateText(t);
      const p = ease(span(t, TL.scroll1, TL.scroll1End)) + ease(span(t, TL.scroll2, TL.scroll2End));
      if (p !== lastP) {
        els.final.style.transform = 'translate3d(0,' + ((2 - p) * H).toFixed(1) + 'px,0)';
        els.lyrics.style.transform = 'translate3d(0,' + ((1 - p) * H).toFixed(1) + 'px,0)';
        els.moonWrap.style.marginTop = (-p * H).toFixed(1) + 'px';
        els.vignette.style.transform = 'translate3d(0,' + (-p * H).toFixed(1) + 'px,0)';
        lastP = p;
      }
      if (p < 1 && t > TL.reveal - 0.4) { updateA(t, p); draw(sceneA, camA, p); }
      else if (mtVisible) updateMoonText(t, p);
      if (p > 0.001 && p < 1.999) { updateB(t); draw(sceneB, camB, p - 1); }
      if (p > 1.001) { updateC(t); draw(sceneC, camC, p - 2); }
      if (!paused) requestAnimationFrame(frame);
    }

    els.replay.addEventListener('click', () => { t = 0; lastP = -1; });
    window.addEventListener('resize', () => { lastP = -1; });
    window.__seek = (s) => { t = s; lastP = -1; };
    // para revisar un momento exacto sin que corra el reloj
    window.__renderAt = (s) => { paused = true; t = s; lastP = -1; frame(performance.now()); };
    window.__TL = TL;

    progress(1, 'Listo');
    return {
      go: function () {
        running = true;
        last = performance.now();
        requestAnimationFrame(frame);
        try {
          if (navigator.wakeLock && navigator.wakeLock.request) navigator.wakeLock.request('screen').catch(() => {});
        } catch (err) { /* sin wake lock */ }
      }
    };
  }

  /* ---------- arranque ---------- */
  // arranca de una en negro: los textos del inicio corren mientras el mundo 3D se arma detras.
  let ready = false, begun = false, startT = 0, beginResolve;
  const began = new Promise((r) => { beginResolve = r; });
  function begin() { begun = true; startT = performance.now(); beginResolve(); }
  function preFrame(now) {
    if (ready) return;
    t = begun ? (now - startT) / 1000 : 0;
    showText(els.b1, window4(t, TL.b1));
    showText(els.b2a, window4(t, TL.b2a));
    showText(els.b2b, window4(t, TL.b2b));
    requestAnimationFrame(preFrame);
  }
  requestAnimationFrame(preFrame);
  begin();

  (async function main() {
    let app;
    try {
      app = await init();
    } catch (err) {
      console.error(err);
      ready = true;
      const msg = document.createElement('p');
      msg.className = 'beat';
      msg.style.opacity = '1';
      msg.style.fontSize = '18px';
      msg.textContent = 'No se pudo iniciar la escena 3D. Revisa que tu navegador tenga WebGL activado.';
      els.intro.appendChild(msg);
      return;
    }
    await began;
    ready = true;
    t = (performance.now() - startT) / 1000;
    app.go();
  })();
})();
</script>
